version: "1.0"

vocareum:
  org_id: "12345"
  course_id: "67890"
  template_assignment_id: "99999"
  api_base_url: "https://api.vocareum.com"

assignments:
  - assignment_id: "11111"
    name: "Lab 1: Introduction"
    path: "assignment1"
    settings:
      due_date: "2025-03-15T23:59:00Z"
      description: "Introduction to the course"
    parts:
      - part_id: "22222"
        path: "part1"
        name: "Part 1: Setup"
        directories: ["startercode", "scripts"]
      - part_id: "33333"
        path: "part2"
        name: "Part 2: Analysis"
        directories: ["startercode", "scripts", "docs"]

  - assignment_id: null
    name: "Lab 2: Classification"
    path: "assignment2"
    create_from_template: true
    settings:
      due_date: "2025-03-22T23:59:00Z"
    parts:
      - part_id: null
        path: "part1"
        name: "Part 1: Implementation"
        directories: ["startercode", "scripts"]

publish_options:
  on_missing_id: "skip"
  auto_commit: false
  abort_on_error: false
  sync_deletes: false
  exclude_patterns:
    - "*.tmp"
    - ".DS_Store"
    - "*.pyc"
    - "__pycache__"

publish_history:
  - timestamp: "2025-02-10T14:30:00Z"
    commit_sha: "abc123"
    published_by: "local-user"
    content_state:
      "assignment1/part1/startercode": "sha256:abc123def456"
      "assignment1/part1/scripts": "sha256:def456ghi789"
    updated:
      - assignment: "11111"
        parts: ["22222", "33333"]
