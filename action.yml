name: 'Vocareum Publisher'
description: 'Publish assignment content from GitHub to Vocareum'
author: 'Vocareum'
branding:
  icon: 'upload-cloud'
  color: 'blue'

# Composite action: installs the published `vocgit` CLI (pinned to this action's
# version) and runs `vocgit push`. Inputs map to CLI flags / env vars. This
# supports both v2 token auth (api-key) and v3 OAuth (auth + client-id/secret).
# Requires Node.js (>=18) on the runner — GitHub-hosted runners include it.
#
# This file must live at the repository root: `uses: ddlin/vocareum-publisher@v1`
# resolves action.yml at the root only, and the install step reads the adjacent
# package.json to pin the npm install to the tagged release's version.

inputs:
  config-file:
    description: 'Path to vocareum.yaml'
    required: false
    default: 'vocareum.yaml'
  api-key:
    description: 'Vocareum v2 API key/token (token auth). Leave empty when using v3 OAuth.'
    required: false
  auth:
    description: 'Auth mode: token (v2, default) or oauth (v3).'
    required: false
    default: 'token'
  client-id:
    description: 'v3 OAuth client id (use with auth: oauth). Pass via a secret.'
    required: false
  client-secret:
    description: 'v3 OAuth client secret (use with auth: oauth). Pass via a secret.'
    required: false
  dry-run:
    description: 'Preview changes without publishing'
    required: false
    default: 'false'
  non-interactive:
    description: 'Run without prompts (recommended for CI/CD)'
    required: false
    default: 'true'
  assignment:
    description: 'Specific assignment to publish'
    required: false
  part:
    description: 'Specific part to publish'
    required: false
  force-all:
    description: 'Re-upload all directories (ignore hash-based change detection)'
    required: false
    default: 'false'
  sync-deletes:
    description: 'Delete files from Vocareum not in Git (experimental)'
    required: false
    default: 'false'
  auto-commit:
    description: 'Ignored in CI/CD (auto-commit causes state drift); kept for compatibility.'
    required: false
    default: 'false'
  verbose:
    description: 'Enable verbose logging'
    required: false
    default: 'false'

outputs:
  success:
    description: 'true when the push completed successfully (the job fails otherwise)'
    value: ${{ steps.push.outputs.success }}

runs:
  using: 'composite'
  steps:
    - name: Install vocgit (version pinned to this action)
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f "${GITHUB_ACTION_PATH}/package.json" ]; then
          echo "::error::package.json not found next to action.yml (${GITHUB_ACTION_PATH}); the action must be referenced from the repository root (uses: ddlin/vocareum-publisher@<tag>)."
          exit 1
        fi
        VERSION="$(node -p "require('${GITHUB_ACTION_PATH}/package.json').version")"
        echo "Installing vocareum-publisher@${VERSION}"
        npm install -g "vocareum-publisher@${VERSION}"
        vocgit --version
    - name: Publish to Vocareum
      id: push
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        DRY_RUN: ${{ inputs.dry-run }}
        NON_INTERACTIVE: ${{ inputs.non-interactive }}
        ASSIGNMENT: ${{ inputs.assignment }}
        PART: ${{ inputs.part }}
        FORCE_ALL: ${{ inputs.force-all }}
        SYNC_DELETES: ${{ inputs.sync-deletes }}
        AUTO_COMMIT: ${{ inputs.auto-commit }}
        VERBOSE: ${{ inputs.verbose }}
        # Credentials passed as env (preferred over flags, which leak in process listings).
        VOCAREUM_API_KEY: ${{ inputs.api-key }}
        VOCAREUM_AUTH_MODE: ${{ inputs.auth }}
        VOCAREUM_OAUTH_CLIENT_ID: ${{ inputs.client-id }}
        VOCAREUM_OAUTH_CLIENT_SECRET: ${{ inputs.client-secret }}
      run: |
        set -euo pipefail
        ARGS=(push --config "${CONFIG_FILE}")
        [ "${NON_INTERACTIVE}" = "true" ] && ARGS+=(--non-interactive)
        [ "${DRY_RUN}" = "true" ] && ARGS+=(--dry-run)
        [ "${FORCE_ALL}" = "true" ] && ARGS+=(--force-all)
        [ "${SYNC_DELETES}" = "true" ] && ARGS+=(--sync-deletes)
        [ "${VERBOSE}" = "true" ] && ARGS+=(--verbose)
        [ -n "${ASSIGNMENT}" ] && ARGS+=(--assignment "${ASSIGNMENT}")
        [ -n "${PART}" ] && ARGS+=(--part "${PART}")
        if [ "${AUTO_COMMIT}" = "true" ]; then
          echo "::warning::auto-commit is ignored in CI/CD (causes state drift); commit vocareum.yaml locally instead."
        fi
        vocgit "${ARGS[@]}"
        echo "success=true" >> "${GITHUB_OUTPUT}"
