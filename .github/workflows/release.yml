name: Release

# Creates a GitHub release for each version tag with the VS Code extension
# vsix attached. The extension is distributed via these release assets (not
# the Marketplace), so every release page must carry the current build — even
# when the extension itself didn't change between CLI versions.
#
# Pattern v*.*.* intentionally excludes the moving major tag (v1), which is
# force-pushed on every release and must not create releases of its own.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Package VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci --no-fund --no-audit
          npm run package
      - name: Create GitHub release with vsix attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXT_VERSION="$(node -p "require('./vscode-extension/package.json').version")"
          gh release create "${GITHUB_REF_NAME}" vscode-extension/vocgit-*.vsix \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "CLI: \`vocareum-publisher@${GITHUB_REF_NAME#v}\` ([npm](https://www.npmjs.com/package/vocareum-publisher)) — see [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md) for details.

VS Code extension: the attached \`vocgit-${EXT_VERSION}.vsix\` is the current extension build (extension versions move independently of the CLI). Install with \`code --install-extension vocgit-${EXT_VERSION}.vsix\` — see [vscode-extension/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/vscode-extension/README.md) for details."
