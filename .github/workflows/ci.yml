name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build  # dist/ is required by the subprocess integration tests (action-smoke, exit-codes)
      - run: npx vitest run
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Guards the composite action's install wiring: action.yml must sit at the
  # repo root, and its version probe must resolve the adjacent package.json.
  # This class of breakage is invisible to tsc/vitest (see AGENTS.md).
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install js-yaml (used to parse action.yml below)
        run: npm install --no-save --no-fund --no-audit js-yaml
      - name: action.yml exists at repository root
        run: |
          set -euo pipefail
          test -f action.yml
          node -e "const fs = require('fs'); const yaml = require('js-yaml'); if (yaml.load(fs.readFileSync('action.yml', 'utf8')).runs.using !== 'composite') process.exit(1)"
      - name: Local CLI supports every flag the action passes
        run: |
          set -euo pipefail
          npm run build
          node dist/index.js push --help > push-help.txt
          for flag in --config --root --non-interactive --dry-run --force-all --sync-deletes --verbose --assignment --part; do
            if ! grep -q -- "${flag}" push-help.txt; then
              echo "::error::Local CLI does not support '${flag}', but action.yml passes it."
              exit 1
            fi
          done
      - name: Run the action's install step verbatim
        id: install-smoke
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$(npm view "vocareum-publisher@${VERSION}" version 2>/dev/null || true)" ]; then
            # Release commits land before `npm publish` (bump → commit → publish → tag),
            # so the pinned version may not exist yet. Validate the probe only.
            echo "::notice::vocareum-publisher@${VERSION} not on npm yet; checking version probe only."
            GITHUB_ACTION_PATH="${GITHUB_WORKSPACE}" \
              node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').version"
            echo "published=false" >> "${GITHUB_OUTPUT}"
          else
            SCRIPT="$(node -e "const fs = require('fs'); const yaml = require('js-yaml'); process.stdout.write(yaml.load(fs.readFileSync('action.yml', 'utf8')).runs.steps[0].run)")"
            GITHUB_ACTION_PATH="${GITHUB_WORKSPACE}" bash -euo pipefail -c "${SCRIPT}"
            echo "published=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Installed CLI supports every flag the action passes
        if: steps.install-smoke.outputs.published == 'true'
        run: |
          set -euo pipefail
          # The composite action shells out with these flags. If the published
          # CLI pinned by package.json predates one of them (e.g. --root), the
          # action fails at flag parsing — and the expected-failure assertion
          # below would mask that as success. Check flag support explicitly.
          vocgit push --help > push-help.txt
          for flag in --config --root --non-interactive --dry-run --force-all --sync-deletes --verbose --assignment --part; do
            if ! grep -q -- "${flag}" push-help.txt; then
              echo "::error::Published vocareum-publisher does not support '${flag}', but action.yml passes it. Publish the matching CLI version before tagging this action."
              exit 1
            fi
          done
      - name: Resolve and execute the composite action
        if: steps.install-smoke.outputs.published == 'true'
        id: composite-smoke
        continue-on-error: true
        uses: ./
        with:
          api-key: smoke-test-invalid-token
          non-interactive: true
          dry-run: true
      - name: Verify composite action reached the CLI
        if: steps.install-smoke.outputs.published == 'true'
        run: |
          set -euo pipefail
          # The fixture intentionally has no usable Vocareum credentials/config.
          # Failure proves GitHub resolved action.yml and executed both composite steps.
          [ "${{ steps.composite-smoke.outcome }}" = "failure" ]
